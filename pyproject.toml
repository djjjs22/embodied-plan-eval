[project]
name = "embodied-plan-eval"
version = "0.1.0"
description = "具身任务规划评测：符号状态机执行作客观真值，不需要仿真器"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
