# 模型清单。API key 只写环境变量名，绝不写明文。
# family 用于自偏好实验：评判模型必须和被测模型不同族。

models:
  MiniMax-M3:
    display_name: MiniMax-M3
    base_url: https://api.minimax.chat/v1
    api_key_env: MINIMAX_API_KEY
    family: minimax
    temperature: 0.0
    max_tokens: 1024
    # 国内 key 走 .chat，全球 key 走 .io。填错会 401，用环境变量覆盖不用改代码
    base_url_env: MINIMAX_BASE_URL
    extra_body:
      thinking:
        type: disabled
    token_param: max_completion_tokens

  # DeepSeek V4-Flash，官方端点，价格约为输出 $0.28 / 百万 token。
  # 官方文档写明：thinking 默认开启，不禁用会把推理过程混进正文，
  # 导致 JSON 解析失败。所以必须带上 extra_body。
  deepseek-v4-flash:
    display_name: DeepSeek-V4-Flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    family: deepseek
    temperature: 0.0
    max_tokens: 1024
    extra_body:
      thinking:
        type: disabled

